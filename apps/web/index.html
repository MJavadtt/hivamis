<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#010101" />
    <title>هیوامیس — سیستم‌عامل سازمانی</title>
    <!-- Vazirmatn is self-hosted: this deployment targets an Iranian organisation where
         Google Fonts is often unreachable, and an on-prem install has no egress at all. -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Installable, and able to open with no signal: the production unit fills forms on set. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
