# Full stack: PostgreSQL + API + SPA behind nginx, and the assistant's model (Ollama).
# `infrastructure/hivamis install` writes .env and starts it; by hand, copy .env.docker.example to .env
# and set the secrets before `docker compose up -d`.
#
# Profiles (COMPOSE_PROFILES in .env; the installer chooses):
#   ai       the model on the CPU — the default
#   ai-gpu   the model on NVIDIA GPUs (needs the NVIDIA Container Toolkit)
#   (none)   no model in the stack: set CHAT_MODE=off, or point OLLAMA_URL elsewhere
#   image, image-gpu   pictures with the assistant (audit F-2) — off unless added, with IMAGE_MODE=local
#   speech   speech to text inside the installation (audit F-4): voice to the assistant, meeting
#            recordings — off unless added, with TRANSCRIPTION_URL=http://speech:8000/v1/audio/transcriptions

# The picture server (audit F-2): LocalAI (MIT), on the same internal network, models on a volume.
x-imagegen: &imagegen
  restart: unless-stopped
  environment:
    LOCALAI_MODELS_PATH: /models
  volumes:
    - image-models:/models
  networks:
    ai:
      aliases: [imagegen]
  expose:
    - '8080'

# The model server, as the CPU and GPU profiles share it (audit F-1).
x-ollama: &ollama
  image: ollama/ollama:0.40.3
  restart: unless-stopped
  environment:
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
  volumes:
    - ollama-models:/root/.ollama
  # On the internal network only: no port on the host, and no way out — nothing said to the model
  # leaves the installation. Models are fetched by `ollama-pull`, which runs only when asked.
  networks:
    ai:
      aliases: [ollama]
  expose:
    - '11434'
  healthcheck:
    test: ['CMD', 'ollama', 'list']
    interval: 30s
    timeout: 10s
    retries: 5

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hiva_os}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infrastructure/database/backup:/backup
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hiva} -d ${POSTGRES_DB:-hiva_os}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the API reaches the database.
    expose:
      - '5432'

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      # Mirrors for a server where the public ones are slow or refused (docs/operations.md).
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hiva_os}?schema=public
      NODE_ENV: production
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      IN_MEMORY_FILE_MB: ${IN_MEMORY_FILE_MB:-25}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5}
      JOBS_ENABLED: 'true'
      # Audit SEC-8: production refuses to start with demo accounts active; this starts it anyway, loudly.
      ALLOW_DEMO_ACCOUNTS: ${ALLOW_DEMO_ACCOUNTS:-false}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      # Chromium ships in the image; pinned so the renderer never probes the filesystem.
      PDF_BROWSER_PATH: ${PDF_BROWSER_PATH:-/usr/bin/chromium}
      # The `web` nginx container is the only proxy in front of the API in this stack, so
      # exactly one hop of X-Forwarded-For is trustworthy. Raise this only if you add another
      # proxy in front of `web`, and count the hops.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Each simultaneous render costs roughly 150MB; raise together with the memory limit.
      PDF_MAX_CONCURRENCY: ${PDF_MAX_CONCURRENCY:-2}
      PDF_QUEUE_FACTOR: ${PDF_QUEUE_FACTOR:-4}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # The chat assistant's local model (Hivamis task 5): the `ollama` service in this stack (audit F-1).
      # The installer picks OLLAMA_MODEL for the machine's memory. Ollama on the host instead:
      # OLLAMA_URL=http://host.docker.internal:11434 and no `ai` profile.
      CHAT_MODE: ${CHAT_MODE:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      CHAT_CONCURRENCY: ${CHAT_CONCURRENCY:-1}
      # Pictures (audit F-2): off until the `image` profile is added and IMAGE_MODE=local.
      IMAGE_MODE: ${IMAGE_MODE:-off}
      IMAGE_URL: ${IMAGE_URL:-http://imagegen:8080}
      IMAGE_MODEL: ${IMAGE_MODEL:-sd-1.5-ggml}
      # Speech to text (roadmap #23, audit F-4): the `speech` service, or any OpenAI-shaped
      # /audio/transcriptions endpoint. Empty: voice and recordings say they are not set up.
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-Systran/faster-whisper-medium}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      # Roadmap #50: the address links are built on, one or several organisations, the version shown,
      # and whether start-up brings the reference data up to the code.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TENANT_MODE: ${TENANT_MODE:-single}
      REFERENCE_SYNC: ${REFERENCE_SYNC:-on}
      APP_VERSION: ${APP_VERSION:-}
      # Signing in by mobile and with Google (Hivamis task 4). SMS is off until a provider is set; the
      # sandbox is refused in production (audit SEC-6).
      SMS_MODE: ${SMS_MODE:-off}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_TEMPLATE: ${SMS_TEMPLATE:-}
      SMS_URL: ${SMS_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      # Webhooks (roadmap #46): internal receivers only on an on-premise network; deliveries in flight at once.
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      WEBHOOK_CONCURRENCY: ${WEBHOOK_CONCURRENCY:-8}
      # Everything below the API reads too, and until 2026-10-28 never reached it here: set in .env, it
      # was dropped on the way in, so these features stayed off whatever the settings file said (owner's
      # server report). Each default is the code's own.
      # Texts to the venues (ADR-103): the line they go out from.
      SMS_SENDER: ${SMS_SENDER:-}
      # The bot (roadmap #40, audit F-9): `bale` or `telegram` with its token; `polling` works behind NAT.
      MESSENGER_MODE: ${MESSENGER_MODE:-off}
      MESSENGER_BOT_TOKEN: ${MESSENGER_BOT_TOKEN:-}
      MESSENGER_BOT_USERNAME: ${MESSENGER_BOT_USERNAME:-}
      MESSENGER_WEBHOOK_SECRET: ${MESSENGER_WEBHOOK_SECRET:-}
      MESSENGER_TRANSPORT: ${MESSENGER_TRANSPORT:-polling}
      MESSENGER_API_URL: ${MESSENGER_API_URL:-}
      # Electronic signature (roadmap #41): `http`, a provider behind the documented REST contract.
      ESIGN_MODE: ${ESIGN_MODE:-off}
      ESIGN_URL: ${ESIGN_URL:-}
      ESIGN_API_KEY: ${ESIGN_API_KEY:-}
      ESIGN_WEBHOOK_SECRET: ${ESIGN_WEBHOOK_SECRET:-}
      # The tax authority's invoice system (Moadian). `live` needs the key and certificate inside the
      # container — under /app/storage, which is the `storage` volume.
      MOADIAN_MODE: ${MOADIAN_MODE:-off}
      MOADIAN_URL: ${MOADIAN_URL:-https://tp.tax.gov.ir/requestsmanager/api/v2/}
      MOADIAN_PRIVATE_KEY_PATH: ${MOADIAN_PRIVATE_KEY_PATH:-}
      MOADIAN_CERTIFICATE_PATH: ${MOADIAN_CERTIFICATE_PATH:-}
      # Searching by meaning: an embeddings endpoint (Ollama's own works); empty embeds locally.
      EMBEDDING_URL: ${EMBEDDING_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Web Push: the browsers' push services a subscription may point at; `off` sends nothing.
      PUSH_DELIVERY: ${PUSH_DELIVERY:-on}
      PUSH_SERVICE_HOSTS: ${PUSH_SERVICE_HOSTS:-fcm.googleapis.com,android.googleapis.com,push.services.mozilla.com,web.push.apple.com,notify.windows.com}
      FX_MAX_RATE_AGE_DAYS: ${FX_MAX_RATE_AGE_DAYS:-7}
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-90}
      STORAGE_RESERVE_MB: ${STORAGE_RESERVE_MB:-1024}
      AI_HISTORY_RETENTION_DAYS: ${AI_HISTORY_RETENTION_DAYS:-180}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - storage:/app/storage
    networks: [default, ai]
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  ollama:
    <<: *ollama
    profiles: [ai]

  ollama-gpu:
    <<: *ollama
    profiles: [ai-gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Fetches a model into the shared volume, then exits: the one part of the model's side that may
  # reach the internet. The installer runs it; by hand:
  #   docker compose run --rm ollama-pull qwen3:8b
  ollama-pull:
    image: ollama/ollama:0.40.3
    profiles: [pull]
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ['/bin/sh', '-c', 'ollama serve >/dev/null 2>&1 & sleep 3 && ollama pull "$$0"']
    command: ['${OLLAMA_MODEL:-qwen3:8b}']

  imagegen:
    <<: *imagegen
    image: localai/localai:v4.11.0
    profiles: [image]

  imagegen-gpu:
    <<: *imagegen
    image: localai/localai:v4.11.0-gpu-nvidia-cuda-12
    profiles: [image-gpu]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Fetches a picture model into its volume, then exits — like ollama-pull, the one part allowed out.
  #   docker compose run --rm imagegen-pull models install sd-1.5-ggml
  imagegen-pull:
    image: localai/localai:v4.11.0
    profiles: [pull]
    environment:
      LOCALAI_MODELS_PATH: /models
    volumes:
      - image-models:/models
    command: ['models', 'install', '${IMAGE_MODEL:-sd-1.5-ggml}']

  # Speech to text (audit F-4): Speaches (MIT), a Whisper-compatible server, on the internal network;
  # audio sent to it never leaves the installation. Its models are fetched by speech-pull.
  speech:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [speech]
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: '1'
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    networks:
      ai:
        aliases: [speech]
    expose:
      - '8000'

  #   docker compose run --rm speech-pull Systran/faster-whisper-medium
  speech-pull:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: [pull]
    volumes:
      - speech-models:/home/ubuntu/.cache/huggingface/hub
    entrypoint: ['python', '-c', 'import sys; from huggingface_hub import snapshot_download; print(snapshot_download(sys.argv[1]))']
    command: ['${TRANSCRIPTION_MODEL:-Systran/faster-whisper-medium}']

networks:
  # `internal`: no route out. The API joins it to reach the model; the model has no other network.
  ai:
    internal: true

volumes:
  db-data:
  storage:
  ollama-models:
  image-models:
  speech-models:
