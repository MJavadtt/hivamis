# Full stack: PostgreSQL + API + SPA behind nginx.
# `infrastructure/hivamis install` writes .env and starts it; by hand, copy .env.docker.example to .env
# and set the secrets before `docker compose up -d`.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hiva_os}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infrastructure/database/backup:/backup
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hiva} -d ${POSTGRES_DB:-hiva_os}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published to the host: only the API reaches the database.
    expose:
      - '5432'

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hiva}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hiva_os}?schema=public
      NODE_ENV: production
      PORT: '4000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-5}
      JOBS_ENABLED: 'true'
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      # Chromium ships in the image; pinned so the renderer never probes the filesystem.
      PDF_BROWSER_PATH: ${PDF_BROWSER_PATH:-/usr/bin/chromium}
      # The `web` nginx container is the only proxy in front of the API in this stack, so
      # exactly one hop of X-Forwarded-For is trustworthy. Raise this only if you add another
      # proxy in front of `web`, and count the hops.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Each simultaneous render costs roughly 150MB; raise together with the memory limit.
      PDF_MAX_CONCURRENCY: ${PDF_MAX_CONCURRENCY:-2}
      PDF_QUEUE_FACTOR: ${PDF_QUEUE_FACTOR:-4}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # The chat assistant's local model (Hivamis task 5): Ollama on the host, reached from the container.
      CHAT_MODE: ${CHAT_MODE:-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      CHAT_CONCURRENCY: ${CHAT_CONCURRENCY:-1}
      GUIDE_VIDEO_MAX_MB: ${GUIDE_VIDEO_MAX_MB:-200}
      # Roadmap #50: the address links are built on, one or several organisations, the version shown,
      # and whether start-up brings the reference data up to the code.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TENANT_MODE: ${TENANT_MODE:-single}
      REFERENCE_SYNC: ${REFERENCE_SYNC:-on}
      APP_VERSION: ${APP_VERSION:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - storage:/app/storage
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  db-data:
  storage:
