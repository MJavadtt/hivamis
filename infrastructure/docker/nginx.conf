server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets are immutable; the HTML entry point never is.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;  # re-included: see the file's header
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fonts are NOT content-hashed, so they get a bounded lifetime rather than immutable.
  location /fonts/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 30d;
    add_header Cache-Control "public";
  }

  # The guide's videos (Hivamis task 8) are screen recordings: larger than documents, streamed to
  # the API rather than held here first. Keep the limit just above GUIDE_VIDEO_MAX_MB.
  location /api/v1/guide/videos {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 210m;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32m;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
