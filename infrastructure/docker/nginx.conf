server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/conf.d/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets are immutable; the HTML entry point never is.
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.conf;  # re-included: see the file's header
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Fonts are NOT content-hashed, so they get a bounded lifetime rather than immutable.
  location /fonts/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 30d;
    add_header Cache-Control "public";
  }

  # The install icons (audit UI-1): not hashed either, and redrawn when the mark changes.
  location /icons/ {
    include /etc/nginx/conf.d/security-headers.conf;
    expires 7d;
    add_header Cache-Control "public";
  }

  # Attachments have no size limit (ADR-124): nothing here counts them, and they stream to the API,
  # which refuses what the disk cannot keep, rather than being held here first.
  location = /api/v1/documents {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }

  # So have the guide's videos (Hivamis task 8).
  location /api/v1/guide/videos {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 600s;
  }

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The largest body left: a meeting's recording (100 MB). Above IN_MEMORY_FILE_MB, or an import's limit would be this.
    client_max_body_size 110m;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
