# Security headers, kept in one file because nginx's add_header inheritance is a trap:
# a location block that defines ANY add_header of its own inherits NONE from its parent.
# Every location here that sets a header must therefore include this file too, or it
# silently serves without a CSP.
#
# CSP notes:
#  • No external origins. Vazirmatn is self-hosted (apps/web/public/fonts) because this
#    deployment targets an organisation where Google Fonts is frequently unreachable.
#  • style-src keeps 'unsafe-inline' as the fallback for browsers that do not implement
#    the -elem/-attr split (notably Safari). Where the split IS understood, injected
#    <style> elements are blocked and only style ATTRIBUTES are allowed — which is all
#    the app needs: Recharts positions its tooltips inline, and ui.tsx sets a progress
#    bar width the same way.
#  • upgrade-insecure-requests is deliberately absent: the shipped compose serves plain
#    HTTP on :8080 and TLS is terminated by a proxy in front of this container. Add it
#    at that proxy, together with HSTS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
