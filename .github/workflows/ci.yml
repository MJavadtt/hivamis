name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hiva
          POSTGRES_PASSWORD: hiva
          POSTGRES_DB: hiva_os_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hiva"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://hiva:hiva@localhost:5432/hiva_os_test?schema=public

    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's packageManager; naming it here too is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The root script builds @hiva/contracts and generates the Prisma client first, exactly as a
      # fresh clone needs (audit SYN-1) — CI and a developer's machine take the same path.
      - name: Type-check every package
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # Chrome's own verdict on installing the app, for both manifests (audit UI-1). Lighthouse has
      # had no PWA category since version 12; the runner's Chrome answers the same question.
      - name: Installability
        run: |
          pnpm --filter @hiva/web exec vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          pnpm check:installable http://localhost:4173

      - name: Prepare test environment
        working-directory: apps/api
        run: |
          cp .env.example .env.test
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=\"$DATABASE_URL\"#" .env.test
          sed -i 's#^JWT_SECRET=.*#JWT_SECRET=ci-only-secret-not-for-production-0123456789abcdef#' .env.test
          sed -i 's#^NODE_ENV=.*#NODE_ENV=test#' .env.test
          sed -i 's#^LOG_LEVEL=.*#LOG_LEVEL=silent#' .env.test
          sed -i 's#^JOBS_ENABLED=.*#JOBS_ENABLED=false#' .env.test
          sed -i 's#^RATE_LIMIT_MAX=.*#RATE_LIMIT_MAX=100000#' .env.test
          sed -i 's#^LOGIN_RATE_LIMIT_MAX=.*#LOGIN_RATE_LIMIT_MAX=100000#' .env.test
          # The tests bring their own push service; nothing goes to a real one.
          sed -i 's#^PUSH_DELIVERY=.*#PUSH_DELIVERY=off#' .env.test

      - name: Run the API test suite
        working-directory: apps/api
        run: pnpm test

      # No database, no server — pure logic and small components, so this runs anywhere.
      - name: Run the frontend test suite
        working-directory: apps/web
        run: pnpm test

      # Blocking: what actually ships. High-severity advisories in a runtime dependency fail
      # the build. An unfixable one is unblocked by adding its CVE to pnpm.auditConfig.ignoreCves
      # in the root package.json, with a comment saying why — not by disabling the gate.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

      # Informational: build tooling does not ship, so a dev-only advisory is visible but
      # does not stop a release.
      - name: Audit build tooling (informational)
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infrastructure/docker/Dockerfile.api -t hiva-os-api:ci .
      - name: Build web image
        run: docker build -f infrastructure/docker/Dockerfile.web -t hiva-os-web:ci .
      - name: Check the nginx configuration
        # The configuration as the image ships it, tested by nginx itself (audit Phase 6). `api` is
        # given a placeholder address so the check needs no running stack.
        run: docker run --rm --add-host api:127.0.0.1 hiva-os-web:ci nginx -t

  # Audit F-8: the installer end to end on each system it promises — on a clean runner, not a dry
  # run: prerequisites, the stack built from this commit, the organisation made, the API ready
  # behind nginx, the administrator's activation link printed. Without the assistant's model (a
  # 5 GB download is not this test's business; F-1 tests that path).
  install:
    needs: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: ubuntu-22.04, runner: ubuntu-22.04 }
          - { system: ubuntu-24.04, runner: ubuntu-24.04 }
          - { system: debian-12, runner: ubuntu-24.04, container: 'debian:12' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install on ${{ matrix.system }}
        if: ${{ !matrix.container }}
        run: |
          sudo infrastructure/hivamis prereqs
          infrastructure/hivamis install --org-name 'آژانس آزمایشی' --org-slug ci-agency \
            --admin-email admin@ci.example --admin-name 'مدیر آزمایشی' --port 8080 --no-ai > install.log 2>&1
      - name: Install on ${{ matrix.system }} (in a Debian 12 container, using the runner's engine)
        if: ${{ matrix.container }}
        # The same path inside and out, so the stack's bind mounts mean the same files to the host's engine.
        run: |
          docker run --rm --network host -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" -w "$PWD" ${{ matrix.container }} bash -euc '
              infrastructure/hivamis prereqs
              infrastructure/hivamis install --org-name "آژانس آزمایشی" --org-slug ci-agency \
                --admin-email admin@ci.example --admin-name "مدیر آزمایشی" --port 8080 --no-ai' > install.log 2>&1
      # The activation link the installer prints is a credential: kept in the file, never in the job's log.
      - name: The installation answers
        run: |
          docker compose --project-directory . --env-file .env exec -T api curl -fsS http://127.0.0.1:4000/health/ready
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/auth/me)" = 401
          grep -q '/activate' install.log
      - name: Logs on failure
        if: failure()
        run: |
          grep -v -i 'activat' install.log | tail -60 || true
          docker compose --project-directory . --env-file .env logs --tail 200 || true
